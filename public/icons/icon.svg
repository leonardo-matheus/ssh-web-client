<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2cbf"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Terminal window -->
  <rect x="60" y="100" width="392" height="312" rx="20" fill="#0d1117" stroke="url(#accent)" stroke-width="4"/>
  
  <!-- Terminal header -->
  <rect x="60" y="100" width="392" height="50" rx="20" fill="#161b22"/>
  <rect x="60" y="130" width="392" height="20" fill="#161b22"/>
  
  <!-- Window buttons -->
  <circle cx="100" cy="125" r="12" fill="#ff5f56"/>
  <circle cx="140" cy="125" r="12" fill="#ffbd2e"/>
  <circle cx="180" cy="125" r="12" fill="#27ca40"/>
  
  <!-- Terminal prompt -->
  <text x="90" y="200" font-family="monospace" font-size="32" fill="#3fb950">$</text>
  <text x="130" y="200" font-family="monospace" font-size="32" fill="#c9d1d9">ssh user@server</text>
  
  <!-- Cursor -->
  <rect x="90" y="230" width="16" height="32" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- SSH text -->
  <text x="90" y="300" font-family="monospace" font-size="28" fill="#8892b0">Connected to server</text>
  <text x="90" y="340" font-family="monospace" font-size="28" fill="#3fb950">●</text>
  <text x="120" y="340" font-family="monospace" font-size="28" fill="#8892b0">secure shell</text>
  
  <!-- Lock icon -->
  <g transform="translate(380, 60)">
    <rect x="10" y="20" width="40" height="35" rx="5" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M15 20 V12 A15 15 0 0 1 45 12 V20" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="30" cy="35" r="5" fill="url(#accent)"/>
  </g>
</svg>
