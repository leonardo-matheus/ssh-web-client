<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Web Client</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #8892b0;
            font-size: 1.1rem;
        }

        /* Connection Form */
        .connection-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .connection-panel h2 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            color: #8892b0;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            font-family: monospace;
            resize: vertical;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .auth-tab {
            padding: 10px 20px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #8892b0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: #fff;
        }

        .auth-content {
            display: none;
        }

        .auth-content.active {
            display: block;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Main Content */
        .main-content {
            display: none;
            gap: 20px;
        }

        .main-content.active {
            display: grid;
            grid-template-columns: 350px 1fr;
        }

        .main-content.fullscreen {
            grid-template-columns: 1fr;
        }

        .main-content.fullscreen .sftp-panel {
            display: none;
        }

        /* SFTP Panel */
        .sftp-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            max-height: 600px;
        }

        .sftp-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sftp-header h3 {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sftp-toolbar {
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sftp-toolbar .btn {
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .path-bar {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .path-bar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: monospace;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 12px;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .file-item.selected {
            background: rgba(0, 212, 255, 0.2);
        }

        .file-item i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .file-item .folder-icon {
            color: #ffd43b;
        }

        .file-item .file-icon {
            color: #8892b0;
        }

        .file-item .file-info {
            flex: 1;
            overflow: hidden;
        }

        .file-item .file-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item .file-meta {
            font-size: 0.75rem;
            color: #8892b0;
        }

        /* Terminal Panel */
        .terminal-panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .terminal-header h3 {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .terminal-actions {
            display: flex;
            gap: 10px;
        }

        #terminal {
            flex: 1;
            padding: 10px;
            min-height: 400px;
        }

        /* Status */
        .status-bar {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-dot.connected {
            background: #2ecc71;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal h3 {
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: #2ecc71;
        }

        .toast.error {
            background: #e74c3c;
        }

        .toast.info {
            background: #3498db;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .main-content.active {
                grid-template-columns: 1fr;
            }
            
            .sftp-panel {
                order: 2;
            }
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Hidden file input */
        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-terminal"></i> SSH Web Client</h1>
            <p>Conexão SSH e SFTP diretamente do seu navegador</p>
        </header>

        <!-- Connection Panel -->
        <section class="connection-panel" id="connectionPanel">
            <h2><i class="fas fa-plug"></i> Conectar ao Servidor</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="host">Host / IP</label>
                    <input type="text" id="host" placeholder="192.168.1.100">
                </div>
                <div class="form-group">
                    <label for="port">Porta</label>
                    <input type="number" id="port" value="22" placeholder="22">
                </div>
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="root">
                </div>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="password">
                    <i class="fas fa-key"></i> Senha
                </button>
                <button class="auth-tab" data-tab="privateKey">
                    <i class="fas fa-file-code"></i> Chave Privada
                </button>
            </div>

            <div class="auth-content active" id="passwordAuth">
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha">
                </div>
            </div>

            <div class="auth-content" id="privateKeyAuth">
                <div class="form-group">
                    <label for="privateKey">Chave Privada (PEM)</label>
                    <textarea id="privateKey" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----"></textarea>
                </div>
                <div class="form-group">
                    <label for="passphrase">Passphrase (opcional)</label>
                    <input type="password" id="passphrase" placeholder="Passphrase da chave">
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button class="btn btn-primary" id="connectBtn">
                    <i class="fas fa-plug"></i> Conectar
                </button>
            </div>
        </section>

        <!-- Main Content (Terminal + SFTP) -->
        <section class="main-content" id="mainContent">
            <!-- SFTP Panel -->
            <div class="sftp-panel">
                <div class="sftp-header">
                    <h3><i class="fas fa-folder-open"></i> Gerenciador de Arquivos</h3>
                </div>
                <div class="sftp-toolbar">
                    <button class="btn btn-secondary" id="refreshBtn" title="Atualizar">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="btn btn-secondary" id="newFolderBtn" title="Nova Pasta">
                        <i class="fas fa-folder-plus"></i>
                    </button>
                    <button class="btn btn-secondary" id="uploadBtn" title="Upload">
                        <i class="fas fa-upload"></i>
                    </button>
                    <button class="btn btn-secondary" id="downloadBtn" title="Download">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="btn btn-danger" id="deleteBtn" title="Excluir">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                <div class="path-bar">
                    <button class="btn btn-secondary" id="parentDirBtn" title="Voltar">
                        <i class="fas fa-level-up-alt"></i>
                    </button>
                    <input type="text" id="currentPath" value="/">
                    <button class="btn btn-secondary" id="goPathBtn" title="Ir">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
                <div class="file-list" id="fileList">
                    <!-- Files will be listed here -->
                </div>
            </div>

            <!-- Terminal Panel -->
            <div class="terminal-panel">
                <div class="terminal-header">
                    <h3><i class="fas fa-terminal"></i> Terminal SSH</h3>
                    <div class="terminal-actions">
                        <button class="btn btn-secondary" id="fullscreenBtn" title="Tela Cheia">
                            <i class="fas fa-expand"></i>
                        </button>
                        <button class="btn btn-danger" id="disconnectBtn">
                            <i class="fas fa-power-off"></i> Desconectar
                        </button>
                    </div>
                </div>
                <div id="terminal"></div>
                <div class="status-bar">
                    <div class="status-indicator">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Desconectado</span>
                    </div>
                    <span id="connectionInfo"></span>
                </div>
            </div>
        </section>
    </div>

    <!-- New Folder Modal -->
    <div class="modal-overlay" id="newFolderModal">
        <div class="modal">
            <h3><i class="fas fa-folder-plus"></i> Nova Pasta</h3>
            <div class="form-group">
                <label for="folderName">Nome da pasta</label>
                <input type="text" id="folderName" placeholder="nova-pasta">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelFolderBtn">Cancelar</button>
                <button class="btn btn-primary" id="createFolderBtn">Criar</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3><i class="fas fa-exclamation-triangle" style="color: #e74c3c;"></i> Confirmar Exclusão</h3>
            <p id="deleteMessage">Tem certeza que deseja excluir este item?</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelDeleteBtn">Cancelar</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Excluir</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Hidden file input for upload -->
    <input type="file" id="fileInput" class="hidden-input" multiple>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
