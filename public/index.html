<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Web Client</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Formulário de Conexão -->
        <div id="connection-form" class="panel">
            <h1>🖥️ SSH Web Client</h1>
            <p class="subtitle">Conecte-se a servidores SSH/SFTP pelo navegador</p>
            
            <form id="ssh-form">
                <div class="form-group">
                    <label for="host">Host</label>
                    <input type="text" id="host" name="host" placeholder="exemplo.com ou 192.168.1.1" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="port">Porta</label>
                        <input type="number" id="port" name="port" value="22" required>
                    </div>
                    <div class="form-group">
                        <label for="username">Usuário</label>
                        <input type="text" id="username" name="username" placeholder="root" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="use-key"> Usar chave privada (opcional)
                    </label>
                </div>
                
                <div class="form-group" id="key-group" style="display: none;">
                    <label for="private-key">Chave Privada</label>
                    <textarea id="private-key" name="private_key" placeholder="Cole sua chave privada aqui..."></textarea>
                </div>
                
                <button type="submit" id="connect-btn">
                    <span class="btn-text">Conectar</span>
                    <span class="btn-loading" style="display: none;">Conectando...</span>
                </button>
            </form>
        </div>

        <!-- Terminal SSH -->
        <div id="terminal-container" style="display: none;">
            <div class="terminal-header">
                <div class="terminal-info">
                    <span id="connection-info"></span>
                </div>
                <div class="terminal-actions">
                    <button id="sftp-btn" class="action-btn" title="Gerenciador de Arquivos SFTP">
                        📁 SFTP
                    </button>
                    <button id="fullscreen-btn" class="action-btn" title="Tela Cheia">
                        ⛶
                    </button>
                    <button id="disconnect-btn" class="action-btn danger" title="Desconectar">
                        ✕ Desconectar
                    </button>
                </div>
            </div>
            <div id="terminal"></div>
        </div>

        <!-- Painel SFTP -->
        <div id="sftp-panel" style="display: none;">
            <div class="sftp-header">
                <h2>📁 Gerenciador de Arquivos SFTP</h2>
                <button id="close-sftp" class="action-btn">✕</button>
            </div>
            <div class="sftp-toolbar">
                <div class="path-bar">
                    <span>Caminho:</span>
                    <input type="text" id="current-path" value="/">
                    <button id="go-path" class="action-btn">Ir</button>
                </div>
                <div class="sftp-actions">
                    <button id="upload-btn" class="action-btn">⬆️ Upload</button>
                    <button id="new-folder-btn" class="action-btn">📁 Nova Pasta</button>
                    <button id="refresh-btn" class="action-btn">🔄 Atualizar</button>
                </div>
            </div>
            <div id="file-list" class="file-list">
                <!-- Lista de arquivos será inserida aqui -->
            </div>
            <input type="file" id="file-upload" style="display: none;" multiple>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
